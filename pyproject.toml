[project]
name = "instance-segmentation"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Jeongro", email = "newro0209@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "accelerate>=1.13.0",
    "albumentations>=2.0.8",
    "datasets>=4.8.4",
    "evaluate>=0.4.6",
    "matplotlib>=3.10.8",
    "opencv-python>=4.13.0.92",
    "pycocotools>=2.0.11",
    "pyyaml>=6.0.3",
    "scikit-image>=0.26.0",
    "tensorboard>=2.20.0",
    "torch>=2.11.0",
    "torchaudio>=2.11.0",
    "torchvision>=0.26.0",
    "tqdm>=4.67.3",
    "transformers>=5.6.1",
    "wandb>=0.26.0",
]

[project.scripts]
train = "instance_segmentation.segmentation_trainer:main"
predict = "instance_segmentation.image_predictor:main"
stream = "instance_segmentation.stream_analyzer:main"

[build-system]
requires = ["uv_build>=0.9.30,<0.10.0"]
build-backend = "uv_build"
