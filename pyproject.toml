[project]
name = "instance-segmentation"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "opencv-python>=4.13.0.92",
    "pyyaml>=6.0.3",
    "scipy>=1.17.1",
    "torch>=2.11.0",
    "torchvision>=0.26.0",
    "transformers>=5.6.1",
]

[project.scripts]
train = "instance_segmentation.segmentation_trainer:main"
predict = "instance_segmentation.image_predictor:main"
stream = "instance_segmentation.stream_analyzer:main"
devices = "instance_segmentation.device_explorer:main"
verify = "instance_segmentation.gpu_verifier:main"

[build-system]
requires = ["uv_build>=0.9.30,<0.10.0"]
build-backend = "uv_build"

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
priority = "primary"
