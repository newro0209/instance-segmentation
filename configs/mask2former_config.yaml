# Base Configuration for Instance Segmentation

model:
  name: "facebook/mask2former-swin-small-coco-instance" # Hugging Face model hub path
  type: "mask2former"

dataset:
  name: "scene_parse_150" # Example dataset
  train_split: "train"
  test_split: "validation"
  batch_size: 4
  num_workers: 4

training:
  learning_rate: 0.00005
  num_epochs: 50
  weight_decay: 0.01
  lr_scheduler_type: "cosine"
  warmup_steps: 500
  logging_steps: 10
  eval_steps: 500
  save_steps: 1000
  output_dir: "./results"
  seed: 42

augmentation:
  resize: [512, 512]
  horizontal_flip: 0.5
