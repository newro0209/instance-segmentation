# Mask2Former Configuration for Instance Segmentation

model:
  name: "facebook/mask2former-swin-tiny-coco-instance"
  type: "mask2former"

dataset:
  name: "coco"
  format: "coco_instance"
  train_split: "train"
  test_split: "validation"
  batch_size: 1
  num_workers: 4
  ignore_index: 255
  reduce_labels: false
  splits:
    train:
      image_dir: "data/coco/train/images"
      annotation_file: "data/coco/train/instances.json"
    validation:
      image_dir: "data/coco/validation/images"
      annotation_file: "data/coco/validation/instances.json"

training:
  mode: "fine_tuning" # full_training | full_adjustment | fine_tuning
  learning_rate: 0.00005
  num_epochs: 50
  weight_decay: 0.01
  lr_scheduler_type: "linear"
  warmup_steps: 500
  logging_steps: 10
  eval_steps: 500
  save_steps: 1000
  output_dir: "./results/mask2former-instance"
  seed: 42
  report_to: "none"

augmentation:
  resize: [512, 512]
  horizontal_flip: 0.5

inference:
  task: "instance"
