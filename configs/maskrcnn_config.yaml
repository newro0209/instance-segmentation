# Mask R-CNN Configuration for Instance Segmentation
model:
  name: "facebook/maskrcnn-resnet50-fpn"
  type: "maskrcnn"

dataset:
  name: "cppe-5" # Another example dataset (Medical/Safety)
  batch_size: 4
  num_workers: 4

training:
  learning_rate: 0.00001
  num_epochs: 30
  output_dir: "./results/maskrcnn"
  seed: 42
