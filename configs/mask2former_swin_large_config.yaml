# Large Mask2Former Configuration for Panoptic Segmentation

model:
  name: "facebook/mask2former-swin-large-coco-panoptic"
  type: "mask2former"

dataset:
  name: "scene_parse_150"
  format: "segmentation_folder"
  train_split: "train"
  test_split: "validation"
  batch_size: 1
  num_workers: 4
  ignore_index: 255
  reduce_labels: false
  splits:
    train:
      image_dir: "data/train/images"
      segmentation_map_dir: "data/train/masks"
    validation:
      image_dir: "data/validation/images"
      segmentation_map_dir: "data/validation/masks"

training:
  mode: "full_adjustment" # full_training | full_adjustment | fine_tuning
  learning_rate: 0.00005
  num_epochs: 50
  weight_decay: 0.01
  lr_scheduler_type: "cosine"
  warmup_steps: 500
  logging_steps: 10
  eval_steps: 500
  save_steps: 1000
  output_dir: "./results/mask2former-swin-large"
  seed: 42
  report_to: "none"

augmentation:
  resize: [512, 512]
  horizontal_flip: 0.5

inference:
  task: "panoptic"
